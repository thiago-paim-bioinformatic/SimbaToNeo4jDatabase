services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: # credenciais: nome do banco/senha

    volumes:
      - #"C:/Users//Documents/neo4j/data:/data"
      - #"C:/Users//Documents/neo4j/logs:/logs"
      - #"C:/Users//Documents/neo4j/plugins:/plugins"
      
      
      